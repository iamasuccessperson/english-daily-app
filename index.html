<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Daily</title>
<meta name="description" content="Aplikasi belajar kosakata & grammar bahasa Inggris setiap hari.">
<meta name="theme-color" content="#2F5FE0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    font-size:16px;
    --bg:#F5F6FA;
    --surface:#FFFFFF;
    --surface-2:#EDEFF5;
    --surface-3:#E2E5EE;
    --ink:#161A25;
    --ink-muted:#5C6478;
    --ink-faint:#9096A6;
    --accent:#2F5FE0;
    --accent-strong:#1F46B8;
    --accent-soft:#E7ECFC;
    --warm:#DD8A3C;
    --warm-soft:#FBEBD8;
    --good:#2E9E6B;
    --good-soft:#E3F5EC;
    --bad:#D64550;
    --bad-soft:#FBE6E8;
    --border:#E2E5EE;
    --shadow:rgba(23,31,58,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116;
      --surface:#171B24;
      --surface-2:#1E2330;
      --surface-3:#2A2F3D;
      --ink:#EEF0F5;
      --ink-muted:#9AA3B7;
      --ink-faint:#6B7386;
      --accent:#8098FF;
      --accent-strong:#A6B6FF;
      --accent-soft:#222A47;
      --warm:#EFA966;
      --warm-soft:#3A2A18;
      --good:#57CE99;
      --good-soft:#1B3327;
      --bad:#FF7B84;
      --bad-soft:#3A1E22;
      --border:#2A2F3D;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116;
    --surface:#171B24;
    --surface-2:#1E2330;
    --surface-3:#2A2F3D;
    --ink:#EEF0F5;
    --ink-muted:#9AA3B7;
    --ink-faint:#6B7386;
    --accent:#8098FF;
    --accent-strong:#A6B6FF;
    --accent-soft:#222A47;
    --warm:#EFA966;
    --warm-soft:#3A2A18;
    --good:#57CE99;
    --good-soft:#1B3327;
    --bad:#FF7B84;
    --bad-soft:#3A1E22;
    --border:#2A2F3D;
    --shadow:rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    height:100%;
    display:flex;
    justify-content:center;
    padding-block:0;
  }
  .app{
    width:100%;
    max-width:480px;
    height:100%;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:520px){
    .page{ padding-block:28px; }
    .app{
      height:min(860px, calc(100% - 56px));
      border-radius:28px;
      box-shadow:0 24px 60px var(--shadow), 0 0 0 1px var(--border);
    }
  }

  .appbar{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
    padding:calc(env(safe-area-inset-top,0px) + .9rem) 1.1rem .9rem;
    border-bottom:1px solid var(--border);
  }
  .appbar h1{
    font-family:"Fraunces",serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  .streak-chip{
    display:flex;
    align-items:center;
    gap:.35rem;
    background:var(--warm-soft);
    color:var(--warm);
    border-radius:999px;
    padding:.3rem .65rem;
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:.85rem;
  }
  .streak-chip svg{width:15px;height:15px;}

  #view{
    flex:1;
    overflow-y:auto;
    padding:1.1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch;
  }

  .tabbar{
    flex:none;
    display:flex;
    border-top:1px solid var(--border);
    padding:.4rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));
    background:var(--surface);
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.2rem;
    padding:.35rem 0;
    border:none;
    background:none;
    color:var(--ink-faint);
    font-family:"Inter",sans-serif;
    font-size:.68rem;
    font-weight:600;
    cursor:pointer;
    border-radius:.6rem;
  }
  .tab svg{width:21px;height:21px;}
  .tab .tab-glyph{
    font-family:"Fraunces",serif;
    font-size:1.05rem;
    line-height:1;
    font-weight:600;
  }
  .tab.active{ color:var(--accent); }
  .tab:active{ background:var(--surface-2); }

  h2.section-title{
    font-family:"Fraunces",serif;
    font-size:1.3rem;
    font-weight:600;
    margin:0 0 .9rem;
    text-wrap:balance;
  }
  p.section-sub{
    color:var(--ink-muted);
    font-size:.9rem;
    line-height:1.5;
    margin:0 0 1rem;
  }

  .card{
    background:var(--surface-2);
    border-radius:1.1rem;
    padding:1.1rem;
  }
  .hero-card{
    background:linear-gradient(165deg, var(--accent-soft), var(--surface-2) 70%);
    border-radius:1.4rem;
    padding:1.4rem 1.3rem;
    margin-bottom:1.1rem;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:.9rem;
  }
  .flame-badge{
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .flame-badge svg{width:26px;height:26px;color:var(--warm);}
  .flame-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:1.5rem;
    font-weight:600;
    line-height:1;
  }
  .flame-label{
    font-size:.72rem;
    color:var(--ink-muted);
    margin-top:.1rem;
  }
  .hero-sub{
    font-size:.9rem;
    color:var(--ink-muted);
    margin:0 0 1.1rem;
    line-height:1.5;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.4rem;
    width:100%;
    padding:.85rem 1rem;
    border-radius:.9rem;
    border:none;
    font-family:"Inter",sans-serif;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-strong); }
  .btn-secondary{ background:var(--surface); color:var(--accent); border:1.5px solid var(--accent); }
  .btn-ghost{ background:transparent; color:var(--ink-muted); }
  .btn-danger{ background:transparent; color:var(--bad); border:1.5px solid var(--bad); }
  .btn-danger:active{ background:var(--bad-soft); }
  .btn:disabled{ opacity:.5; cursor:default; }

  .badge{
    display:inline-flex;
    align-items:center;
    font-family:"IBM Plex Mono",monospace;
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.02em;
    padding:.15rem .5rem;
    border-radius:999px;
    background:var(--surface-3);
    color:var(--ink-muted);
  }
  .badge-accent{ background:var(--accent-soft); color:var(--accent); }
  .badge-good{ background:var(--good-soft); color:var(--good); }
  .badge-muted{ background:var(--surface-3); color:var(--ink-faint); }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.6rem;
    margin-bottom:1.2rem;
  }
  .stat-tile{
    background:var(--surface-2);
    border-radius:1rem;
    padding:.9rem .6rem;
    text-align:center;
  }
  .stat-value{
    font-family:"IBM Plex Mono",monospace;
    font-size:1.4rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .stat-caption{
    font-size:.68rem;
    color:var(--ink-muted);
    margin-top:.15rem;
    line-height:1.3;
  }

  .level-row{
    display:flex;
    align-items:center;
    gap:.7rem;
    padding:.55rem 0;
  }
  .level-row .lv-tag{
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-muted);
    width:1.6rem;
    flex:none;
  }
  .level-track{
    position:relative;
    flex:1;
    height:.5rem;
    border-radius:999px;
    background:var(--surface-3);
    overflow:hidden;
  }
  .level-fill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    border-radius:999px;
    background:var(--good);
  }
  .level-fill-learning{
    background:var(--good);
    opacity:.32;
  }
  .level-row .lv-count{
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;
    color:var(--ink-muted);
    flex:none;
    font-variant-numeric:tabular-nums;
  }

  .word-group{ margin-bottom:1.3rem; }
  .word-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:.4rem;
  }
  .word-group-head h3{
    font-family:"Fraunces",serif;
    font-size:.95rem;
    font-weight:600;
    margin:0;
  }
  .word-group-note{
    font-family:"Inter",sans-serif;
    font-size:.72rem;
    font-weight:400;
    color:var(--ink-faint);
  }
  .word-row{
    display:flex;
    align-items:center;
    gap:.65rem;
    padding:.65rem .2rem;
    border-bottom:1px solid var(--border);
  }
  .word-row:last-child{ border-bottom:none; }
  .word-dot{
    width:.5rem;height:.5rem;border-radius:50%;flex:none;
    background:var(--ink-faint);
  }
  .word-dot.learning{ background:var(--accent); }
  .word-dot.mastered{ background:var(--good); }
  .word-main{ flex:1; min-width:0; }
  .word-en{ font-weight:600; font-size:.95rem; }
  .word-id{ color:var(--ink-muted); font-size:.82rem; }

  details.topic{
    background:var(--surface-2);
    border-radius:1rem;
    padding:.2rem .95rem;
    margin-bottom:.7rem;
  }
  details.topic summary{
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.6rem;
    padding:.85rem 0;
    cursor:pointer;
    font-weight:600;
    font-size:.92rem;
  }
  details.topic summary::-webkit-details-marker{ display:none; }
  details.topic summary .chev{
    color:var(--ink-faint);
    transition:transform .15s ease;
    flex:none;
  }
  details.topic[open] summary .chev{ transform:rotate(90deg); }
  .topic-body{ padding:0 0 1rem; }
  .topic-explain{ font-size:.87rem; color:var(--ink-muted); line-height:1.55; margin:0 0 .7rem; }
  .topic-example{
    font-size:.85rem;
    padding:.3rem 0;
    border-left:2px solid var(--accent);
    padding-left:.6rem;
    margin-bottom:.35rem;
    color:var(--ink);
  }
  .locked-row{
    display:flex;
    align-items:center;
    gap:.6rem;
    padding:.55rem .2rem;
    color:var(--ink-faint);
    font-size:.86rem;
    border-bottom:1px solid var(--border);
  }
  .locked-row:last-child{border-bottom:none;}
  .locked-row svg{ width:15px;height:15px;flex:none; }
  .locked-level-head{
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-faint);
    margin:1rem 0 .3rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  /* ---- session overlay ---- */
  .session{
    position:absolute; inset:0;
    background:var(--surface);
    display:flex; flex-direction:column;
    z-index:20;
  }
  .session[hidden]{ display:none; }
  .session-top{
    flex:none;
    display:flex;
    align-items:center;
    gap:.7rem;
    padding:calc(env(safe-area-inset-top,0px) + .9rem) 1.1rem .8rem;
  }
  .session-close{
    background:none;border:none;color:var(--ink-faint);
    font-size:1.3rem;line-height:1;cursor:pointer;padding:.2rem;
  }
  .session-progress{
    flex:1;
    height:.4rem;
    background:var(--surface-3);
    border-radius:999px;
    overflow:hidden;
  }
  .session-progress-fill{
    height:100%;background:var(--accent);border-radius:999px;
    transition:width .2s ease;
  }
  .session-body{
    flex:1;
    overflow-y:auto;
    padding:1rem 1.3rem;
    display:flex;
    flex-direction:column;
  }
  .session-bottom{
    flex:none;
    padding:.9rem 1.1rem calc(1rem + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
  }

  .flashcard{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:1rem;
    padding:1rem 0;
  }
  .flashcard .fc-level{ margin-bottom:.2rem; }
  .flashcard .fc-prompt{
    font-size:1rem;
    color:var(--ink-muted);
  }
  .flashcard .fc-word{
    font-family:"Fraunces",serif;
    font-size:2.1rem;
    font-weight:600;
    text-wrap:balance;
  }
  .flashcard .fc-example{
    font-size:.95rem;
    color:var(--ink-muted);
    line-height:1.55;
    max-width:22rem;
  }
  .flashcard .fc-example b{ color:var(--accent); font-weight:700; }

  .rate-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:.5rem;
  }
  .rate-btn{
    border:1.5px solid var(--border);
    background:var(--surface);
    border-radius:.8rem;
    padding:.6rem .3rem;
    font-family:"Inter",sans-serif;
    font-weight:600;
    font-size:.78rem;
    cursor:pointer;
    color:var(--ink);
  }
  .rate-btn.rate-0{ color:var(--bad); }
  .rate-btn.rate-5{ color:var(--good); }

  .quiz-meta{ margin:0 0 .6rem; }
  .quiz-q{
    font-family:"Fraunces",serif;
    font-size:1.2rem;
    font-weight:600;
    margin:0 0 1.1rem;
    text-wrap:balance;
  }
  .quiz-options{ display:flex; flex-direction:column; gap:.6rem; }
  .quiz-opt{
    border:1.5px solid var(--border);
    background:var(--surface);
    border-radius:.8rem;
    padding:.75rem .9rem;
    font-size:.92rem;
    text-align:left;
    cursor:pointer;
    color:var(--ink);
  }
  .quiz-opt.correct{ border-color:var(--good); background:var(--good-soft); color:var(--good); }
  .quiz-opt.wrong{ border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
  .quiz-opt:disabled{ cursor:default; }

  .summary-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:.4rem;
  }
  .summary-wrap .sw-check{ color:var(--good); width:52px;height:52px; margin-bottom:.4rem; }
  .summary-wrap h2{
    font-family:"Fraunces",serif;
    font-size:1.4rem;
    margin:0 0 .2rem;
  }
  .summary-list{
    margin:1.1rem 0 0;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    width:100%;
  }
  .summary-item{
    display:flex;
    justify-content:space-between;
    background:var(--surface-2);
    border-radius:.8rem;
    padding:.65rem .9rem;
    font-size:.88rem;
  }
  .summary-item b{ font-family:"IBM Plex Mono",monospace; }

  .empty-note{
    color:var(--ink-muted);
    font-size:.88rem;
    text-align:center;
    padding:2.2rem 1rem;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="page">
  <div class="app">
    <header class="appbar">
      <h1>English Daily</h1>
      <div class="streak-chip" id="streak-chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c4.4 0 7-2.7 7-6.5 0-3-1.8-4.7-3-6.3.4 2-.5 3-1.5 3.3-.2-2.6-1.5-5-4-6.8-.3 2-1 3.4-2.3 4.7C6.8 11.8 5 13.7 5 16.2 5 19.6 7.8 22 12 22Z"/></svg>
        <span id="streak-num">0</span>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        Hari Ini
      </button>
      <button class="tab" data-tab="vocab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13Z"/></svg>
        Kosakata
      </button>
      <button class="tab" data-tab="grammar">
        <span class="tab-glyph">Aa</span>
        Grammar
      </button>
      <button class="tab" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V13"/><path d="M12 19V8"/><path d="M19 19V4"/></svg>
        Progres
      </button>
    </nav>

    <section class="session" id="session" hidden>
      <div class="session-top">
        <button class="session-close" id="session-close" aria-label="Tutup sesi">&times;</button>
        <div class="session-progress"><div class="session-progress-fill" id="session-progress-fill" style="width:0%"></div></div>
      </div>
      <div class="session-body" id="session-body"></div>
      <div class="session-bottom" id="session-bottom"></div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- content ---------------- */

  var VOCAB_KIND_LABELS = { phrasal: "frasa", formal: "formal", gerund: "gerund", casual: "percakapan", idiom: "idiom", topical: "tema" };

  var VOCAB = [

    {id:"weather", word:"weather", translation:"cuaca", sentence:"The {blank} is cold this morning.", level:"A1"},
    {id:"journey", word:"journey", translation:"perjalanan", sentence:"Our {blank} to Bali took six hours.", level:"A1"},
    {id:"borrow", word:"borrow", translation:"meminjam", sentence:"Can I {blank} your pen for a minute?", level:"A1"},
    {id:"crowded", word:"crowded", translation:"ramai / padat", sentence:"The train was very {blank} this morning.", level:"A1"},
    {id:"improve", word:"improve", translation:"meningkatkan", sentence:"I want to {blank} my English speaking.", level:"A1"},

    {id:"achieve", word:"achieve", translation:"mencapai", sentence:"She worked hard to {blank} her goals.", level:"A2"},
    {id:"reliable", word:"reliable", translation:"dapat diandalkan", sentence:"He is a very {blank} colleague.", level:"A2"},
    {id:"postpone", word:"postpone", translation:"menunda", sentence:"We had to {blank} the meeting until Monday.", level:"A2"},
    {id:"considerable", word:"considerable", translation:"cukup besar / signifikan", sentence:"There was a {blank} increase in sales.", level:"A2"},
    {id:"commute", word:"commute", translation:"pulang-pergi kerja", sentence:"I {blank} to the office by train every day.", level:"A2"},

    {id:"inevitable", word:"inevitable", translation:"tak terhindarkan", sentence:"Change is {blank} in a growing company.", level:"B1"},
    {id:"reluctant", word:"reluctant", translation:"enggan / segan", sentence:"He was {blank} to accept the offer.", level:"B1"},
    {id:"compelling", word:"compelling", translation:"meyakinkan / menarik", sentence:"She gave a {blank} argument for the plan.", level:"B1"},
    {id:"subsequently", word:"subsequently", translation:"selanjutnya / kemudian", sentence:"The plan failed and was {blank} cancelled.", level:"B1"},
    {id:"discrepancy", word:"discrepancy", translation:"ketidaksesuaian / selisih", sentence:"There is a {blank} between the two reports.", level:"B1"},

    {id:"ambiguous", word:"ambiguous", translation:"ambigu / bermakna ganda", sentence:"His answer was {blank} and hard to interpret.", level:"B2"},
    {id:"underpin", word:"underpin", translation:"mendasari / mendukung", sentence:"Strong data {blank} the company's decision.", level:"B2"},
    {id:"discern", word:"discern", translation:"membedakan / mengenali", sentence:"It's hard to {blank} the difference between the two colors.", level:"B2"},
    {id:"mitigate", word:"mitigate", translation:"meredakan / mengurangi", sentence:"New policies aim to {blank} the risk of delays.", level:"B2"},
    {id:"nuanced", word:"nuanced", translation:"bernuansa / halus perbedaannya", sentence:"Her explanation was {blank} and well thought out.", level:"B2"},

    // Phrasal verbs -- common conversational word combinations whose
    // meaning changes when the words are said together.

    {id:"work-life-balance", word:"work-life balance", translation:"keseimbangan kerja dan kehidupan pribadi", sentence:"The company promotes a healthy {blank}.", level:"B1", kind:"topical"},

    // Topical everyday vocabulary: Family & relationships.
    {id:"sibling", word:"sibling", translation:"saudara kandung", sentence:"I have two {blank}s, a brother and a sister.", level:"A1", kind:"topical"},
    {id:"relative", word:"relative", translation:"kerabat", sentence:"We invited all our {blank}s to the wedding.", level:"A1", kind:"topical"},
    {id:"neighbor", word:"neighbor", translation:"tetangga", sentence:"Our {blank} is always friendly and helpful.", level:"A1", kind:"topical"},
    {id:"acquaintance", word:"acquaintance", translation:"kenalan", sentence:"He's just an {blank}, not a close friend.", level:"A2", kind:"topical"},
    {id:"reunion", word:"reunion", translation:"reuni", sentence:"We're planning a family {blank} next year.", level:"A1", kind:"topical"},
    {id:"bond", word:"bond", translation:"ikatan hubungan", sentence:"They share a strong {blank} as childhood friends.", level:"A2", kind:"topical"},
    {id:"trust", word:"trust", translation:"kepercayaan", sentence:"{blank} is the foundation of any good relationship.", level:"A1", kind:"topical"},
    {id:"supportive", word:"supportive", translation:"suportif", sentence:"Her family has always been very {blank}.", level:"A2", kind:"topical"},
    {id:"considerate", word:"considerate", translation:"penuh pertimbangan / perhatian", sentence:"He's always {blank} of other people's feelings.", level:"A2", kind:"topical"},
    {id:"loyalty", word:"loyalty", translation:"kesetiaan", sentence:"Their friendship is built on {blank} and honesty.", level:"A2", kind:"topical"},
  ];

  var LEVELS = ["A1","A2","B1","B2","C1"];
  // Vocabulary now only spans A1-B2 (the old ultra-basic A1 tier -- house,
  // water, friend, happy, eat -- was removed and every remaining word
  // shifted down one CEFR notch). Grammar's own A1-C1 progression is a
  // different, independent difficulty ladder and keeps using LEVELS above.
  var VOCAB_LEVELS = ["A1","A2","B1","B2"];

  var GRAMMAR_A1 = [
    {
      id:"to-be", level:"A1", title:"To be (am / is / are)",
      explanation:"Dipakai untuk menyatakan identitas, sifat, atau kondisi. I → am, He/She/It → is, You/We/They → are.",
      examples:["I am a teacher.","She is happy.","They are at home."],
      quiz:[
        {q:"She ___ my sister.", options:["is","are","am"], answer:"is"},
        {q:"We ___ ready.", options:["is","am","are"], answer:"are"}
      ]
    },
    {
      id:"simple-present", level:"A1", title:"Simple Present",
      explanation:"Untuk kebiasaan, fakta, dan rutinitas. Tambahkan -s / -es untuk subjek he / she / it.",
      examples:["I work every day.","The sun rises in the east.","She plays tennis on Sundays."],
      quiz:[
        {q:"He ___ at a bank.", options:["work","works","working"], answer:"works"},
        {q:"They ___ coffee.", options:["don't like","doesn't like","not like"], answer:"don't like"}
      ]
    },
    {
      id:"articles", level:"A1", title:"Artikel a / an / the",
      explanation:"'a' sebelum kata berawalan konsonan, 'an' sebelum kata berawalan vokal, 'the' untuk sesuatu yang sudah spesifik atau diketahui.",
      examples:["I saw a cat.","She ate an apple.","The book on the table is mine."],
      quiz:[
        {q:"I need ___ umbrella.", options:["a","an","the"], answer:"an"},
        {q:"___ sun is very bright today.", options:["A","An","The"], answer:"The"}
      ]
    },
    {
      id:"plural-nouns", level:"A1", title:"Plural Nouns",
      explanation:"Tambahkan -s untuk kebanyakan kata benda, -es untuk akhiran s/x/ch/sh, ubah y menjadi -ies, dan beberapa bentuk tidak beraturan (irregular).",
      examples:["one book, two books","one box, two boxes","one city, two cities","one child, two children"],
      quiz:[
        {q:"one baby, two ___", options:["babys","babies","babyes"], answer:"babies"},
        {q:"one man, two ___", options:["mans","men","manes"], answer:"men"}
      ]
    },
    {
      id:"there-is-are", level:"A1", title:"There is / There are",
      explanation:"'There is' untuk benda tunggal atau tak terhitung, 'There are' untuk benda jamak.",
      examples:["There is a cat on the roof.","There are three books on the table.","There isn't any milk left."],
      quiz:[
        {q:"___ a park near my house.", options:["There is","There are"], answer:"There is"},
        {q:"___ many people at the concert.", options:["There is","There are"], answer:"There are"}
      ]
    }
  ];

  var GRAMMAR_PREVIEW = {
    A2: ["Present continuous","Past simple (reguler & irregular)","Past continuous","Comparative & superlative","Countable/uncountable + some/any","Future (going to/will)","Modal dasar (can/could/should/must)","Conjunctions dasar"],
    B1: ["Present perfect vs simple past","Present perfect continuous","Past perfect","First & second conditional","Passive voice dasar","Reported speech dasar","Relative clauses (who/which/that)","Gerund vs infinitive"],
    B2: ["Third conditional & mixed conditionals","Passive voice lanjutan","Reported speech lanjutan","Relative clauses non-defining","Modal perfect (should have/could have)","Phrasal verbs kontekstual","Linking words lanjutan"],
    C1: ["Inversion untuk penekanan","Advanced conditionals & wish/if only","Participle clauses","Advanced passive constructions","Nuansa modal","Collocations & idiomatic expressions","Discourse markers formal"]
  };

  // These size a single sesi/latihan tambahan, not a daily allowance --
  // there is no longer a "you've hit today's limit" wall. Start another
  // session (via "Latihan Tambahan") as many times as you want in one day
  // to keep introducing more new words and clearing more reviews.
  var SESSION_REVIEW_CAP = 15;
  var NEW_WORDS_PER_SESSION = 8;

  /* ---------------- helpers ---------------- */

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function addDaysStr(str, days){
    var d = new Date(str+"T00:00:00");
    d.setDate(d.getDate()+days);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function vocabById(id){
    for (var i=0;i<VOCAB.length;i++) if (VOCAB[i].id===id) return VOCAB[i];
    return null;
  }
  function grammarById(id){
    for (var i=0;i<GRAMMAR_A1.length;i++) if (GRAMMAR_A1[i].id===id) return GRAMMAR_A1[i];
    return null;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- spaced repetition (SM-2), mirrors the RN app's spacedRepetition.ts ---------------- */

  function scheduleNextReview(prev, quality, today){
    var repetitions = prev.repetitions, easeFactor = prev.easeFactor, intervalDays = prev.intervalDays;
    if (quality < 3){
      repetitions = 0;
      intervalDays = 1;
    } else {
      repetitions += 1;
      if (repetitions === 1) intervalDays = 1;
      else if (repetitions === 2) intervalDays = 6;
      else intervalDays = Math.round(intervalDays * easeFactor);
    }
    easeFactor = Math.max(1.3, easeFactor + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02)));
    var dueDate = addDaysStr(today, intervalDays);
    var mastered = repetitions >= 4 && intervalDays >= 21;
    return {
      wordId: prev.wordId,
      introducedAt: prev.introducedAt || today,
      repetitions: repetitions,
      easeFactor: easeFactor,
      intervalDays: intervalDays,
      dueDate: dueDate,
      lastReviewedAt: today,
      mastered: mastered
    };
  }

  function freshReviewState(wordId, today){
    return { wordId: wordId, introducedAt: today, repetitions:0, easeFactor:2.5, intervalDays:0, dueDate:today, lastReviewedAt:null, mastered:false };
  }

  /* ---------------- state ---------------- */

  var DEFAULT_STATE = {
    reviewStates:{},
    grammarProgress:{},
    meta:{ currentStreakDays:0, longestStreakDays:0, lastSessionDate:null }
  };

  var state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  var persistTimer = null;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var dirty = false;

  // Netlify build: no Claude Artifact db capability here, so persistence is
  // plain per-device local storage. Cross-device continuity is deliberately
  // manual (see exportProgress/importProgress below) rather than automatic --
  // no accounts, no backend, works instantly and for free for anyone who
  // opens the site.
  function writeSnapshot(){
    var snapshot = clone(state);
    try { localStorage.setItem("english-daily-state", JSON.stringify(snapshot)); } catch(e){}
  }

  function persist(){
    dirty = true;
    clearTimeout(persistTimer);
    persistTimer = setTimeout(writeSnapshot, 350);
  }

  function flushPersist(){
    if (!dirty) return;
    clearTimeout(persistTimer);
    writeSnapshot();
  }

  function mergeLoadedState(loaded){
    // Guard against a slow initial load resolving AFTER the user has
    // already started interacting (and possibly changed local state) --
    // local changes always win over a stale remote read.
    if (dirty) return;
    if (!loaded || typeof loaded !== "object") return;
    // db snapshots (and their .data()) are delivered FROZEN -- clone
    // before adopting them into `state`, or later mutations (e.g. adding
    // a new grammarProgress[id] key) throw "object is not extensible".
    state.reviewStates = clone(loaded.reviewStates || {});
    state.grammarProgress = clone(loaded.grammarProgress || {});
    state.meta = Object.assign({currentStreakDays:0, longestStreakDays:0, lastSessionDate:null}, clone(loaded.meta || {}));
    render();
  }

  function initPersistence(){
    try {
      var raw = localStorage.getItem("english-daily-state");
      if (raw) mergeLoadedState(JSON.parse(raw));
    } catch(e){}
  }

  // Manual cross-device continuity: since there is no account/login system,
  // moving progress from one device to another (e.g. HP -> laptop) is a
  // deliberate export-then-import, not automatic. Kept intentionally simple
  // (one JSON file, no server round-trip) -- an automatic-sync upgrade path
  // (accounts + a real backend) can be layered on later without touching
  // this shape, since it's exactly the same `state` object used everywhere
  // else in the app.
  function exportProgress(){
    var snapshot = clone(state);
    var blob = new Blob([JSON.stringify(snapshot, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "english-daily-progress-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function importProgressFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var loaded = JSON.parse(String(reader.result));
        if (!loaded || typeof loaded !== "object") throw new Error("format tidak dikenali");
        state.reviewStates = clone(loaded.reviewStates || {});
        state.grammarProgress = clone(loaded.grammarProgress || {});
        state.meta = Object.assign({currentStreakDays:0, longestStreakDays:0, lastSessionDate:null}, clone(loaded.meta || {}));
        dirty = true;
        flushPersist();
        render();
        var view = document.getElementById("view");
        var note = document.createElement("div");
        note.className = "empty-note";
        note.textContent = "Progres berhasil diimpor.";
        view.prepend(note);
        setTimeout(function(){ note.remove(); }, 2200);
      } catch(e){
        var view2 = document.getElementById("view");
        var note2 = document.createElement("div");
        note2.className = "empty-note";
        note2.textContent = "Gagal mengimpor file -- pastikan ini file export dari aplikasi ini.";
        view2.prepend(note2);
        setTimeout(function(){ note2.remove(); }, 3000);
      }
    };
    reader.readAsText(file);
  }

  // Wipe all learning progress (reviewStates, grammarProgress, streak) and
  // start fresh, as if the user had just installed the app. Writes
  // immediately (not debounced) since this is a deliberate, infrequent action.
  function resetProgress(){
    state = clone(DEFAULT_STATE);
    dirty = true;
    resetConfirmOpen = false;
    flushPersist();
    render();
  }

  /* ---------------- domain logic ---------------- */

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function dueVocabCount(){
    var today = todayStr();
    var c = 0;
    for (var id in state.reviewStates) if (state.reviewStates[id].dueDate <= today) c++;
    return c;
  }
  // How many new words the NEXT session will introduce -- not a daily
  // allowance check, just the per-session batch size (or fewer, if the
  // whole catalog is nearly exhausted).
  function newAvailableTodayCount(){
    var notIntroduced = 0;
    for (var i=0;i<VOCAB.length;i++) if (!state.reviewStates[VOCAB[i].id]) notIntroduced++;
    return Math.min(NEW_WORDS_PER_SESSION, notIntroduced);
  }
  function pickGrammarTopicForToday(){
    var today = todayStr();
    var notDoneToday = GRAMMAR_A1.filter(function(t){
      var p = state.grammarProgress[t.id];
      return !p || p.lastReviewedAt !== today;
    });
    if (notDoneToday.length === 0) return null;
    var incomplete = notDoneToday.filter(function(t){
      var p = state.grammarProgress[t.id];
      return !p || !p.completed;
    });
    if (incomplete.length > 0) return incomplete[0];
    notDoneToday.sort(function(a,b){
      var da = (state.grammarProgress[a.id]||{}).lastReviewedAt || "";
      var db_ = (state.grammarProgress[b.id]||{}).lastReviewedAt || "";
      return da.localeCompare(db_);
    });
    return notDoneToday[0];
  }
  // New words are picked from the not-yet-learned pool, preferring anything
  // above the absolute-beginner (A1) tier -- A1 is only used as filler once
  // every more advanced word has already been introduced. Within whichever
  // pool is used, the pick is randomized rather than always taking the
  // words in the same fixed catalog order.
  function pickNewWords(count){
    if (count <= 0) return [];
    // No more A1-deprioritization split needed: since the ultra-basic
    // words were removed, every remaining A1 entry is genuinely reasonable
    // starter vocabulary, not something to shuffle to the back.
    var unlearned = VOCAB.filter(function(w){ return !state.reviewStates[w.id]; });
    return shuffle(unlearned).slice(0, count);
  }

  // A session has two separate phases, not one interleaved list:
  // (1) STUDY -- every new word for today shown one after another, word +
  //     meaning + example together, no quiz in between;
  // (2) QUIZ -- all of those just-studied words PLUS every word due for
  //     review, as one batch, in an order shuffled independently of the
  //     study order (so the quiz doesn't just replay the same sequence).
  // Grammar (if any) comes after both, as its own step.
  function buildSessionPlan(){
    var today = todayStr();
    var due = [];
    for (var id in state.reviewStates){
      // vocabById guard: a word removed from the catalog after being
      // learned shouldn't crash the session -- just drop its review.
      if (state.reviewStates[id].dueDate <= today && vocabById(id)) due.push(state.reviewStates[id]);
    }
    due.sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); });
    var dueCapped = due.slice(0, SESSION_REVIEW_CAP);

    var notIntroduced = VOCAB.filter(function(w){ return !state.reviewStates[w.id]; }).length;
    var newCount = Math.min(NEW_WORDS_PER_SESSION, notIntroduced);
    var newWords = pickNewWords(newCount);

    var studyList = newWords.map(function(w){ return w.id; });

    var quizItems = [];
    newWords.forEach(function(w){ quizItems.push({wordId:w.id, isNew:true}); });
    dueCapped.forEach(function(r){ quizItems.push({wordId:r.wordId, isNew:false}); });
    var quizList = shuffle(quizItems);

    var topic = pickGrammarTopicForToday();

    return { studyList:studyList, quizList:quizList, grammarTopic:topic };
  }
  function levelStats(){
    return VOCAB_LEVELS.map(function(lv){
      var words = VOCAB.filter(function(w){ return w.level===lv; });
      var mastered = 0, introduced = 0;
      words.forEach(function(w){
        var r = state.reviewStates[w.id];
        if (!r) return;
        introduced++;
        if (r.mastered) mastered++;
      });
      // "introduced" includes mastered words too (it's every word that has
      // been started), so the UI can stack: solid bar = mastered, lighter
      // bar = introduced but not yet mastered = introduced - mastered.
      return { level:lv, total:words.length, mastered:mastered, introduced:introduced };
    });
  }
  function totalMastered(){
    var c = 0;
    for (var id in state.reviewStates) if (state.reviewStates[id].mastered) c++;
    return c;
  }
  function grammarCompletedCount(){
    var c = 0;
    GRAMMAR_A1.forEach(function(t){
      var p = state.grammarProgress[t.id];
      if (p && p.completed) c++;
    });
    return c;
  }

  function completeSession(isExtra){
    var today = todayStr();
    if (!isExtra && state.meta.lastSessionDate !== today){
      var yesterday = addDaysStr(today, -1);
      if (state.meta.lastSessionDate === yesterday) state.meta.currentStreakDays += 1;
      else state.meta.currentStreakDays = 1;
      state.meta.lastSessionDate = today;
      state.meta.longestStreakDays = Math.max(state.meta.longestStreakDays, state.meta.currentStreakDays);
    }
    persist();
  }

  /* ---------------- rendering: shell ---------------- */

  var activeTab = "home";
  var resetConfirmOpen = false;
  var sessionState = null;

  function render(){
    document.getElementById("streak-num").textContent = state.meta.currentStreakDays;
    if (sessionState){ renderSession(); return; }
    var view = document.getElementById("view");
    if (activeTab === "home") view.innerHTML = homeHtml();
    else if (activeTab === "vocab") view.innerHTML = vocabHtml();
    else if (activeTab === "grammar") view.innerHTML = grammarHtml();
    else if (activeTab === "progress") view.innerHTML = progressHtml();
  }

  function setTab(name){
    activeTab = name;
    if (name !== "progress") resetConfirmOpen = false;
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-tab") === name);
    });
    render();
  }

  /* ---------------- rendering: home ---------------- */

  function homeHtml(){
    var today = todayStr();
    var doneToday = state.meta.lastSessionDate === today;
    var due = dueVocabCount();
    var fresh = newAvailableTodayCount();
    var grammarLeft = pickGrammarTopicForToday();
    var hasSomethingLeft = due > 0 || fresh > 0 || !!grammarLeft;

    var subtitle, ctaLabel, ctaAttr;
    if (!doneToday){
      var parts = [];
      if (due > 0) parts.push(due + " kata untuk direview");
      if (fresh > 0) parts.push(fresh + " kata baru");
      if (grammarLeft) parts.push("1 topik grammar");
      subtitle = parts.length ? parts.join(" &middot; ") : "Semua materi untuk hari ini sudah dipelajari.";
      ctaLabel = "Mulai Sesi Hari Ini";
      ctaAttr = hasSomethingLeft ? "data-action=\"start-session\"" : "disabled";
    } else if (hasSomethingLeft){
      subtitle = "Sesi hari ini sudah selesai. Latihan tambahan tidak memengaruhi hari beruntun.";
      ctaLabel = "Latihan Tambahan";
      ctaAttr = "data-action=\"start-session-extra\"";
    } else {
      subtitle = "Semua materi untuk hari ini sudah dipelajari. Sampai jumpa besok!";
      ctaLabel = "Sudah Selesai Hari Ini";
      ctaAttr = "disabled";
    }

    var html = "";
    html += "<div class=\"hero-card\">";
    html += "  <div class=\"hero-top\">";
    html += "    <div class=\"flame-badge\">";
    html += "      <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 22c4.4 0 7-2.7 7-6.5 0-3-1.8-4.7-3-6.3.4 2-.5 3-1.5 3.3-.2-2.6-1.5-5-4-6.8-.3 2-1 3.4-2.3 4.7C6.8 11.8 5 13.7 5 16.2 5 19.6 7.8 22 12 22Z\"/></svg>";
    html += "      <div><div class=\"flame-num\">" + state.meta.currentStreakDays + "</div><div class=\"flame-label\">hari beruntun</div></div>";
    html += "    </div>";
    html += "    <span class=\"badge badge-good\">" + totalMastered() + "/" + VOCAB.length + " dikuasai</span>";
    html += "  </div>";
    html += "  <p class=\"hero-sub\">" + subtitle + "</p>";
    html += "  <button class=\"btn btn-primary\" " + ctaAttr + ">" + ctaLabel + "</button>";
    html += "</div>";

    html += "<h2 class=\"section-title\">Ringkasan</h2>";
    html += "<div class=\"stat-grid\">";
    html += statTile(state.meta.currentStreakDays, "Hari beruntun");
    html += statTile(state.meta.longestStreakDays, "Rekor beruntun");
    html += statTile(totalMastered(), "Kata dikuasai");
    html += "</div>";

    html += "<h2 class=\"section-title\">Progres per level</h2>";
    html += "<div class=\"card\">";
    levelStats().forEach(function(s){
      var pct = s.total ? Math.round((s.mastered/s.total)*100) : 0;
      html += "<div class=\"level-row\"><span class=\"lv-tag\">" + s.level + "</span><div class=\"level-track\"><div class=\"level-fill\" style=\"width:" + pct + "%\"></div></div><span class=\"lv-count\">" + s.mastered + "/" + s.total + "</span></div>";
    });
    html += "</div>";

    return html;
  }

  function statTile(value, caption){
    return "<div class=\"stat-tile\"><div class=\"stat-value\">" + value + "</div><div class=\"stat-caption\">" + caption + "</div></div>";
  }

  /* ---------------- rendering: vocab list ---------------- */

  // Natural CEFR order. There's no more "too basic, hide it at the back"
  // tier to work around (see VOCAB_LEVELS) -- A1 is a normal starting
  // point again, so it's shown first like every other level list.
  var VOCAB_DISPLAY_ORDER = VOCAB_LEVELS;

  function vocabHtml(){
    var html = "<h2 class=\"section-title\">Kosakata</h2><p class=\"section-sub\">" + VOCAB.length + " kata & frasa (percakapan, formal, phrasal verb, gerund, idiom, tema sehari-hari), level A1&ndash;B2. Kata baru diperkenalkan lewat kuis secara acak, tidak dibatasi harian &mdash; lalu diulang lagi lewat kuis review.</p>";
    VOCAB_DISPLAY_ORDER.forEach(function(lv){
      var words = VOCAB.filter(function(w){ return w.level === lv; });
      var mastered = words.filter(function(w){ var r = state.reviewStates[w.id]; return r && r.mastered; }).length;
      html += "<div class=\"word-group\"><div class=\"word-group-head\"><h3>Level " + lv + "</h3><span class=\"badge badge-muted\">" + mastered + "/" + words.length + "</span></div>";
      words.forEach(function(w){
        var r = state.reviewStates[w.id];
        var dotClass = r ? (r.mastered ? "mastered" : "learning") : "";
        var kindTag = VOCAB_KIND_LABELS[w.kind] ? " <span class=\"badge badge-muted\" style=\"font-size:.6rem;vertical-align:middle\">" + VOCAB_KIND_LABELS[w.kind] + "</span>" : "";
        html += "<div class=\"word-row\"><span class=\"word-dot " + dotClass + "\"></span><div class=\"word-main\"><div class=\"word-en\">" + escapeHtml(w.word) + kindTag + "</div><div class=\"word-id\">" + escapeHtml(w.translation) + "</div></div></div>";
      });
      html += "</div>";
    });
    return html;
  }

  /* ---------------- rendering: grammar list ---------------- */

  function grammarHtml(){
    var html = "<h2 class=\"section-title\">Grammar</h2><p class=\"section-sub\">Kurikulum inti dimulai dari level A1. " + grammarCompletedCount() + "/" + GRAMMAR_A1.length + " topik sudah dipelajari.</p>";
    GRAMMAR_A1.forEach(function(t){
      var p = state.grammarProgress[t.id];
      var badge = p && p.completed ? "<span class=\"badge badge-good\">Selesai</span>" : "<span class=\"badge badge-muted\">Belum</span>";
      html += "<details class=\"topic\"><summary><span>" + escapeHtml(t.title) + "</span><span style=\"display:flex;align-items:center;gap:.5rem\">" + badge + "<svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 6l6 6-6 6\"/></svg></span></summary>";
      html += "<div class=\"topic-body\"><p class=\"topic-explain\">" + escapeHtml(t.explanation) + "</p>";
      t.examples.forEach(function(ex){ html += "<div class=\"topic-example\">" + escapeHtml(ex) + "</div>"; });
      html += "</div></details>";
    });
    LEVELS.slice(1).forEach(function(lv){
      html += "<div class=\"locked-level-head\">Level " + lv + " &middot; segera</div>";
      GRAMMAR_PREVIEW[lv].forEach(function(title){
        html += "<div class=\"locked-row\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"5\" y=\"10\" width=\"14\" height=\"9\" rx=\"1.5\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/></svg>" + escapeHtml(title) + "</div>";
      });
    });
    return html;
  }

  /* ---------------- rendering: progress ---------------- */

  function progressHtml(){
    var html = "<h2 class=\"section-title\">Progres</h2>";
    html += "<div class=\"stat-grid\">";
    html += statTile(state.meta.currentStreakDays, "Hari beruntun saat ini");
    html += statTile(state.meta.longestStreakDays, "Rekor hari beruntun");
    html += statTile(totalMastered() + "/" + VOCAB.length, "Kata dikuasai");
    html += "</div>";

    html += "<h2 class=\"section-title\">Kosakata per level</h2><p class=\"section-sub\">Bar terang = sedang dipelajari, bar solid = sudah dikuasai (butuh sekitar 3 minggu review yang konsisten).</p><div class=\"card\">";
    levelStats().forEach(function(s){
      var masteredPct = s.total ? Math.round((s.mastered/s.total)*100) : 0;
      var introducedPct = s.total ? Math.round((s.introduced/s.total)*100) : 0;
      html += "<div class=\"level-row\"><span class=\"lv-tag\">" + s.level + "</span><div class=\"level-track\"><div class=\"level-fill level-fill-learning\" style=\"width:" + introducedPct + "%\"></div><div class=\"level-fill\" style=\"width:" + masteredPct + "%\"></div></div><span class=\"lv-count\">" + s.mastered + "/" + s.total + "</span></div>";
    });
    html += "</div>";

    // Labeled "Dasar" (not "A1") on purpose: this tracks the 5 core
    // grammar topics (to-be, simple present, articles, plural nouns,
    // there is/are), a completely separate progression from the vocab
    // CEFR levels above. Calling it "A1" here reads as a leftover of the
    // deleted vocab A1 tier even though it's unrelated -- so the label was
    // changed to avoid that confusion, while the underlying progress data
    // (grammarProgress, GRAMMAR_A1) is untouched.
    html += "<h2 class=\"section-title\">Grammar Dasar</h2><div class=\"card\">";
    html += "<div class=\"level-row\"><span class=\"lv-tag\" style=\"width:auto;white-space:nowrap\">Dasar</span><div class=\"level-track\"><div class=\"level-fill\" style=\"width:" + Math.round((grammarCompletedCount()/GRAMMAR_A1.length)*100) + "%\"></div></div><span class=\"lv-count\">" + grammarCompletedCount() + "/" + GRAMMAR_A1.length + "</span></div>";
    html += "</div>";

    html += "<h2 class=\"section-title\">Pindah Perangkat</h2><div class=\"card\">";
    html += "<p class=\"section-sub\" style=\"margin:0 0 .8rem\">Progres tersimpan di perangkat ini saja. Untuk melanjutkan di HP/laptop lain, export dulu di sini, lalu import file-nya di perangkat itu.</p>";
    html += "<div style=\"display:flex;gap:.6rem\">";
    html += "<button class=\"btn btn-secondary\" data-action=\"export-progress\">Export Progres</button>";
    html += "<button class=\"btn btn-secondary\" data-action=\"import-progress\">Import Progres</button>";
    html += "</div>";
    html += "<input type=\"file\" id=\"import-file-input\" accept=\"application/json\" hidden>";
    html += "</div>";

    html += "<h2 class=\"section-title\">Mulai Ulang</h2><div class=\"card\">";
    if (!resetConfirmOpen){
      html += "<p class=\"section-sub\" style=\"margin:0 0 .8rem\">Hapus semua progres (kosakata, grammar, hari beruntun) dan mulai belajar dari awal lagi.</p>";
      html += "<button class=\"btn btn-danger\" data-action=\"reset-progress-ask\">Reset Progres</button>";
    } else {
      html += "<p class=\"section-sub\" style=\"margin:0 0 .8rem\"><b>Yakin?</b> Semua kata yang sudah dipelajari, progres grammar, dan hari beruntun akan hilang permanen. Ini tidak bisa dibatalkan.</p>";
      html += "<div style=\"display:flex;gap:.6rem\">";
      html += "<button class=\"btn btn-ghost\" data-action=\"reset-progress-cancel\">Batal</button>";
      html += "<button class=\"btn btn-danger\" data-action=\"reset-progress-confirm\">Ya, Reset</button>";
      html += "</div>";
    }
    html += "</div>";

    return html;
  }

  /* ---------------- session flow ---------------- */

  function startSession(isExtra){
    var plan = buildSessionPlan();
    if (plan.studyList.length === 0 && plan.quizList.length === 0 && !plan.grammarTopic){
      var view = document.getElementById("view");
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "Tidak ada yang perlu dipelajari sekarang. Coba lagi nanti atau besok.";
      view.prepend(note);
      setTimeout(function(){ note.remove(); }, 2200);
      return;
    }
    sessionState = {
      isExtra: !!isExtra,
      studyList: plan.studyList,
      studyIndex: 0,
      quizList: plan.quizList,
      quizIndex: 0,
      vocabAnswered: false,
      vocabChosen: null,
      vocabCorrect: false,
      vocabOptions: null,
      grammarTopic: plan.grammarTopic,
      grammarDone: !plan.grammarTopic,
      grammarQuizIndex: -1,
      grammarQuizAnswered: false,
      tally: { reviewed:0, introduced:0, grammarTitle:null }
    };
    document.getElementById("session").hidden = false;
    renderSession();
  }

  function endSession(){
    sessionState = null;
    document.getElementById("session").hidden = true;
    render();
  }

  function renderSession(){
    var s = sessionState;
    var total = Math.max(1, s.studyList.length + s.quizList.length + (s.grammarTopic ? 1 : 0));
    var done;
    if (s.studyIndex < s.studyList.length) done = s.studyIndex;
    else if (s.quizIndex < s.quizList.length) done = s.studyList.length + s.quizIndex;
    else if (!s.grammarDone) done = s.studyList.length + s.quizList.length;
    else done = total;
    document.getElementById("session-progress-fill").style.width = Math.round((done/total)*100) + "%";

    if (s.studyIndex < s.studyList.length){ renderStudyCard(s.studyList[s.studyIndex]); return; }
    if (s.quizIndex < s.quizList.length){ renderVocabQuizStep(s.quizList[s.quizIndex]); return; }
    if (!s.grammarDone){ renderGrammarStep(); return; }
    renderSummary();
  }

  // Study phase: every new word for today, shown one after another --
  // word, translation, and example together, no quiz interleaved. Only
  // once every word in this batch has been seen does the quiz phase begin.
  function renderStudyCard(wordId){
    var word = vocabById(wordId);
    var body = document.getElementById("session-body");
    var bottom = document.getElementById("session-bottom");
    var sentence = escapeHtml(word.sentence).replace("{blank}", "<b>" + escapeHtml(word.word) + "</b>");
    body.innerHTML =
      "<div class=\"flashcard\">" +
      "<span class=\"badge badge-accent fc-level\">" + word.level + " &middot; baru (" + (sessionState.studyIndex + 1) + "/" + sessionState.studyList.length + ")</span>" +
      "<div class=\"fc-word\">" + escapeHtml(word.word) + "</div>" +
      "<div class=\"fc-prompt\">" + escapeHtml(word.translation) + "</div>" +
      "<div class=\"fc-example\">" + sentence + "</div>" +
      "</div>";
    var isLast = sessionState.studyIndex === sessionState.studyList.length - 1;
    bottom.innerHTML = "<button class=\"btn btn-primary\" data-action=\"study-next\">" + (isLast ? "Mulai Kuis" : "Lanjut") + "</button>";
  }

  // Active-recall multiple-choice quiz, shared by both a just-studied new
  // word and a word due for review -- same test either way, only the badge
  // label and the daily tally (introduced vs. reviewed) differ.
  function buildVocabOptions(word){
    var pool = VOCAB.filter(function(w){ return w.id !== word.id; }).slice();
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var options = pool.slice(0, 3).map(function(w){ return w.word; });
    options.push(word.word);
    for (var k = options.length - 1; k > 0; k--){
      var l = Math.floor(Math.random() * (k + 1));
      var t = options[k]; options[k] = options[l]; options[l] = t;
    }
    return options;
  }

  function renderVocabQuizStep(item){
    var word = vocabById(item.wordId);
    var body = document.getElementById("session-body");
    var bottom = document.getElementById("session-bottom");

    if (!sessionState.vocabOptions) sessionState.vocabOptions = buildVocabOptions(word);
    var metaLabel = item.isNew ? "kuis" : "review";
    var meta = "<div class=\"quiz-meta\"><span class=\"badge badge-accent\">" + word.level + " &middot; " + metaLabel + "</span></div>";

    if (!sessionState.vocabAnswered){
      var html = meta + "<div class=\"quiz-q\">Apa bahasa Inggris dari \"" + escapeHtml(word.translation) + "\"?</div><div class=\"quiz-options\">";
      sessionState.vocabOptions.forEach(function(opt){
        html += "<button class=\"quiz-opt\" data-action=\"vocab-answer\" data-word=\"" + escapeHtml(opt) + "\">" + escapeHtml(opt) + "</button>";
      });
      html += "</div>";
      body.innerHTML = html;
      bottom.innerHTML = "<button class=\"btn btn-ghost\" disabled data-action=\"noop\">Pilih jawaban di atas</button>";
    } else {
      var sentence = escapeHtml(word.sentence).replace("{blank}", "<b>" + escapeHtml(word.word) + "</b>");
      var html2 = meta + "<div class=\"quiz-q\">Apa bahasa Inggris dari \"" + escapeHtml(word.translation) + "\"?</div><div class=\"quiz-options\">";
      sessionState.vocabOptions.forEach(function(opt){
        var cls = "quiz-opt";
        if (opt === word.word) cls += " correct";
        else if (opt === sessionState.vocabChosen) cls += " wrong";
        html2 += "<button class=\"" + cls + "\" disabled>" + escapeHtml(opt) + "</button>";
      });
      html2 += "</div><div class=\"topic-example\" style=\"margin-top:1rem\">" + sentence + "</div>";
      body.innerHTML = html2;
      bottom.innerHTML = "<button class=\"btn btn-primary\" data-action=\"vocab-continue\">Lanjut</button>";
    }
  }

  function renderGrammarStep(){
    var topic = sessionState.grammarTopic;
    var body = document.getElementById("session-body");
    var bottom = document.getElementById("session-bottom");

    if (sessionState.grammarQuizIndex < 0){
      // intro screen
      var html = "<div><span class=\"badge badge-accent\">" + topic.level + "</span>";
      html += "<h2 style=\"font-family:'Fraunces',serif;font-size:1.3rem;margin:.7rem 0 .5rem;\">" + escapeHtml(topic.title) + "</h2>";
      html += "<p class=\"topic-explain\">" + escapeHtml(topic.explanation) + "</p>";
      topic.examples.forEach(function(ex){ html += "<div class=\"topic-example\">" + escapeHtml(ex) + "</div>"; });
      html += "</div>";
      body.innerHTML = html;
      bottom.innerHTML = "<button class=\"btn btn-primary\" data-action=\"start-quiz\">Mulai Kuis</button>";
      return;
    }

    if (sessionState.grammarQuizIndex >= topic.quiz.length){
      sessionState.tally.grammarTitle = topic.title;
      var today = todayStr();
      state.grammarProgress[topic.id] = { completed:true, lastReviewedAt: today };
      persist();
      sessionState.grammarDone = true;
      renderSession();
      return;
    }

    var q = topic.quiz[sessionState.grammarQuizIndex];
    var html2 = "<div class=\"quiz-q\">" + escapeHtml(q.q) + "</div><div class=\"quiz-options\">";
    q.options.forEach(function(opt, i){
      html2 += "<button class=\"quiz-opt\" data-action=\"answer\" data-index=\"" + i + "\">" + escapeHtml(opt) + "</button>";
    });
    html2 += "</div>";
    body.innerHTML = html2;
    bottom.innerHTML = "<button class=\"btn btn-ghost\" disabled data-action=\"noop\">Pilih jawaban di atas</button>";
  }

  function renderSummary(){
    if (!sessionState._counted){
      sessionState._counted = true;
      completeSession(sessionState.isExtra);
      document.getElementById("streak-num").textContent = state.meta.currentStreakDays;
      flushPersist();
    }
    var body = document.getElementById("session-body");
    var bottom = document.getElementById("session-bottom");
    var t = sessionState.tally;
    var html = "<div class=\"summary-wrap\">";
    html += "<svg class=\"sw-check\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 12.5l2.5 2.5L16 9.5\"/></svg>";
    html += "<h2>Sesi selesai!</h2>";
    html += "<p class=\"section-sub\" style=\"margin:0\">Kerja bagus, sampai jumpa lagi.</p>";
    html += "<div class=\"summary-list\">";
    html += "<div class=\"summary-item\"><span>Kata direview</span><b>" + t.reviewed + "</b></div>";
    html += "<div class=\"summary-item\"><span>Kata baru</span><b>" + t.introduced + "</b></div>";
    if (t.grammarTitle) html += "<div class=\"summary-item\"><span>Grammar</span><b>" + escapeHtml(t.grammarTitle) + "</b></div>";
    if (!sessionState.isExtra) html += "<div class=\"summary-item\"><span>Hari beruntun</span><b>" + state.meta.currentStreakDays + "</b></div>";
    html += "</div></div>";
    body.innerHTML = html;
    bottom.innerHTML = "<button class=\"btn btn-primary\" data-action=\"finish-session\">Selesai</button>";
  }

  /* ---------------- event delegation ---------------- */

  function recoverFromError(err){
    var detail = "";
    try { detail = (err && err.message) ? err.message : (err ? String(err) : ""); } catch(e){}
    try { console.error("English Daily error, recovering:", err); } catch(e){}
    sessionState = null;
    var sessionEl = document.getElementById("session");
    if (sessionEl) sessionEl.hidden = true;
    try { render(); } catch(e){}
    var view = document.getElementById("view");
    if (view){
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "Sesi terhenti karena kendala teknis. Silakan mulai lagi." + (detail ? (" [" + detail + "]") : "");
      view.prepend(note);
      setTimeout(function(){ note.remove(); }, 8000);
    }
  }

  document.addEventListener("click", function(e){
    try {
      var tabBtn = e.target.closest(".tab");
      if (tabBtn){ setTab(tabBtn.getAttribute("data-tab")); return; }

      var actionEl = e.target.closest("[data-action]");
      if (!actionEl || actionEl.disabled) return;
      var action = actionEl.getAttribute("data-action");

      if (action === "start-session") startSession(false);
      else if (action === "start-session-extra") startSession(true);
      else if (action === "study-next"){ sessionState.studyIndex += 1; renderSession(); }
      else if (action === "vocab-answer"){
        if (sessionState.vocabAnswered) return;
        var vItem = sessionState.quizList[sessionState.quizIndex];
        var vWord = vocabById(vItem.wordId);
        var chosen = actionEl.getAttribute("data-word");
        sessionState.vocabAnswered = true;
        sessionState.vocabChosen = chosen;
        sessionState.vocabCorrect = (chosen === vWord.word);
        renderSession();
      }
      else if (action === "vocab-continue"){
        var cItem = sessionState.quizList[sessionState.quizIndex];
        var cWord = vocabById(cItem.wordId);
        var cToday = todayStr();
        var cPrev = state.reviewStates[cWord.id] || freshReviewState(cWord.id, cToday);
        var cQuality = sessionState.vocabCorrect ? 4 : 0;
        state.reviewStates[cWord.id] = scheduleNextReview(cPrev, cQuality, cToday);
        persist();
        if (cItem.isNew) sessionState.tally.introduced += 1; else sessionState.tally.reviewed += 1;
        sessionState.quizIndex += 1;
        sessionState.vocabAnswered = false;
        sessionState.vocabChosen = null;
        sessionState.vocabCorrect = false;
        sessionState.vocabOptions = null;
        renderSession();
      }
      else if (action === "start-quiz"){ sessionState.grammarQuizIndex = 0; sessionState.grammarQuizAnswered = false; renderSession(); }
      else if (action === "answer"){
        if (sessionState.grammarQuizAnswered) return;
        sessionState.grammarQuizAnswered = true;
        var topic = sessionState.grammarTopic;
        var q = topic.quiz[sessionState.grammarQuizIndex];
        var chosenIndex = parseInt(actionEl.getAttribute("data-index"), 10);
        var buttons = document.querySelectorAll(".quiz-opt");
        buttons.forEach(function(btn, i){
          btn.disabled = true;
          if (q.options[i] === q.answer) btn.classList.add("correct");
          else if (i === chosenIndex) btn.classList.add("wrong");
        });
        setTimeout(function(){
          try {
            if (!sessionState) return;
            sessionState.grammarQuizIndex += 1;
            sessionState.grammarQuizAnswered = false;
            renderSession();
          } catch(err){ recoverFromError(err); }
        }, 700);
      }
      else if (action === "finish-session") endSession();
      else if (action === "reset-progress-ask"){ resetConfirmOpen = true; render(); }
      else if (action === "reset-progress-cancel"){ resetConfirmOpen = false; render(); }
      else if (action === "reset-progress-confirm") resetProgress();
      else if (action === "export-progress") exportProgress();
      else if (action === "import-progress"){
        var fileInput = document.getElementById("import-file-input");
        if (fileInput) fileInput.click();
      }
    } catch(err){ recoverFromError(err); }
  });

  document.addEventListener("change", function(e){
    try {
      if (e.target && e.target.id === "import-file-input" && e.target.files && e.target.files[0]){
        importProgressFromFile(e.target.files[0]);
        e.target.value = "";
      }
    } catch(err){ recoverFromError(err); }
  });

  document.getElementById("session-close").addEventListener("click", function(){
    try { endSession(); } catch(err){ recoverFromError(err); }
  });

  /* ---------------- boot ---------------- */

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") flushPersist();
  });
  window.addEventListener("pagehide", flushPersist);

  render();
  initPersistence();
})();
</script>
<script>
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline caching is a bonus, not required */ });
    });
  }
</script>
