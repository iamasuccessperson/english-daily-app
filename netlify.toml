[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Single-page app: any unknown path falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
